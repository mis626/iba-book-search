<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>IBA Smart Book Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 18px;
      background: #f6f2ea;
      color: #242320;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      color: #2c3a54;
      font-family: Georgia, serif;
      font-size: 34px;
    }

    .subtitle {
      margin-bottom: 15px;
      color: #625d55;
      font-size: 14px;
      line-height: 1.55;
    }

    .database-info {
      margin-bottom: 12px;
      color: #625d55;
      font-size: 13px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: #2c3a54;
      font-weight: bold;
    }

    textarea,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9d1c2;
      border-radius: 7px;
      background: white;
      font-size: 14px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      font-family: Consolas, monospace;
    }

    textarea:focus,
    input:focus {
      border-color: #2c3a54;
      outline: none;
      box-shadow: 0 0 0 3px rgba(44,58,84,.12);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 11px;
    }

    button {
      min-height: 42px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #2c3a54;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #59667d;
    }

    button.voice {
      background: #913c4c;
    }

    button.feedback-no {
      background: #7c3a4c;
    }

    button.feedback-yes {
      background: #3e6b4f;
    }

    button.correct {
      min-height: 34px;
      margin-top: 10px;
      padding: 7px 12px;
      background: #3e6b4f;
      font-size: 12px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      min-height: 21px;
      margin-top: 14px;
      color: #7c3a4c;
      font-size: 14px;
    }

    .message.success {
      color: #3e6b4f;
    }

    .query-heading {
      margin-top: 22px;
      padding: 11px 13px;
      border-radius: 7px;
      background: #edeff3;
      color: #2c3a54;
      font-weight: bold;
    }

    .feedback-question {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #dfd7c8;
      border-radius: 7px;
      background: #fffaf2;
    }

    .feedback-question-title {
      margin-bottom: 9px;
      font-weight: bold;
      color: #2c3a54;
    }

    .feedback-answer-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .feedback-note {
      margin-top: 8px;
      color: #6d685f;
      font-size: 12px;
    }

    .card {
      margin-top: 10px;
      padding: 15px;
      border: 1px solid #e3dccc;
      border-left: 5px solid #3e6b4f;
      border-radius: 7px;
      background: white;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .card.no-match {
      border-left-color: #7c3a4c;
    }

    .sku {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 9px;
      border-radius: 4px;
      background: #edeff3;
      color: #2c3a54;
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: bold;
    }

    .book-name {
      margin-bottom: 7px;
      font-size: 18px;
      font-weight: bold;
    }

    .detail {
      margin-top: 5px;
      font-size: 14px;
    }

    .stock {
      font-weight: bold;
    }

    .meta {
      margin-top: 8px;
      color: #777168;
      font-size: 12px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.5);
      z-index: 9999;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      border-radius: 9px;
      background: white;
    }

    .modal h2 {
      margin: 0 0 8px;
      color: #2c3a54;
    }

    .form-group {
      margin-top: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 13px;
    }

    .loader {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 7px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 20px 12px;
      }

      h1 {
        font-size: 28px;
      }

      .buttons,
      .feedback-answer-buttons {
        flex-direction: column;
      }

      .buttons button,
      .feedback-answer-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>IBA Smart Book Search</h1>

    <div class="subtitle">
      Text ya voice se SKU, book name, subject, class,
      category aur publisher search karo.
      Dictionary synonyms aur approved feedback automatically apply hote hain.
    </div>

    <div id="databaseInfo" class="database-info">
      Loading IMS and GOV data...
    </div>

    <label class="label" for="searchInput">
      Type or speak your search
    </label>

    <textarea
      id="searchInput"
      placeholder="Examples:
pe 10
ai 9
arts 8
kala
saraswati physical education
rd sharma 10
concept physics"></textarea>

    <div class="buttons">

      <button
        id="searchButton"
        onclick="runSearch()">
        Search Books
      </button>

      <button
        id="voiceButton"
        class="voice"
        onclick="startVoiceSearch()">
        🎤 Voice Search
      </button>

      <button
        id="stopVoiceButton"
        class="secondary"
        onclick="stopVoiceSearch()"
        disabled>
        Stop Voice
      </button>

      <button
        class="secondary"
        onclick="clearSearch()">
        Clear
      </button>

      <button
        class="secondary"
        onclick="loadDatabaseInfo()">
        Refresh Data
      </button>

    </div>

    <div id="message" class="message"></div>
    <div id="results"></div>

  </div>

  <div
    id="feedbackModal"
    class="modal-overlay">

    <div class="modal">

      <h2>Tell us the correct book</h2>

      <div id="feedbackSearchLabel"></div>

      <div class="form-group">
        <label for="expectedBook">
          Expected book name
        </label>

        <input
          id="expectedBook"
          type="text"
          placeholder="Example: CBSE Physical Edu-10 (NSH)">
      </div>

      <div class="form-group">
        <label for="expectedSku">
          Expected SKU, if known
        </label>

        <input
          id="expectedSku"
          type="text"
          placeholder="Example: NSHCPE10-6">
      </div>

      <div class="form-group">
        <label for="feedbackNote">
          Remarks
        </label>

        <input
          id="feedbackNote"
          type="text"
          placeholder="Optional remarks">
      </div>

      <div class="buttons">
        <button
          id="submitFeedbackButton"
          onclick="submitWrongFeedback()">
          Submit Feedback
        </button>

        <button
          class="secondary"
          onclick="closeFeedbackModal()">
          Cancel
        </button>
      </div>

    </div>
  </div>

  <script>
    /*
     * Apna existing Apps Script /exec URL yahan paste karo.
     */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbx19Eyx1duAhPFxZNFCjo0tF-pXYaFeQXjjy3P6RKU-f_dRkBYYhqT9j-oTUM4ZgkoLxw/exec";

    let recognition = null;
    let voiceRunning = false;
    let activeFeedbackSearch = "";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function encodeJsValue(value) {
      return encodeURIComponent(
        String(value ?? "")
      );
    }

    function setMessage(text, success) {
      const element =
        document.getElementById("message");

      element.textContent = text || "";

      element.classList.toggle(
        "success",
        Boolean(success)
      );
    }

    function validateApiUrl() {
      if (
        !API_URL ||
        API_URL.includes("YOUR_APPS") ||
        !API_URL.includes("/exec")
      ) {
        throw new Error(
          "Apps Script /exec URL index.html me add nahi hai."
        );
      }
    }

    function jsonpRequest(parameters) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          "__ibaCallback_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 100000);

        const script =
          document.createElement("script");

        const timeout =
          setTimeout(function() {
            cleanup();

            reject(
              new Error(
                "Backend response timed out."
              )
            );
          }, 60000);

        function cleanup() {
          clearTimeout(timeout);

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        const query =
          new URLSearchParams(parameters);

        query.set(
          "callback",
          callbackName
        );

        query.set(
          "_",
          String(Date.now())
        );

        script.src =
          API_URL +
          "?" +
          query.toString();

        script.onerror = function() {
          cleanup();

          reject(
            new Error(
              "Apps Script backend se connection nahi ho paya."
            )
          );
        };

        document.body.appendChild(script);
      });
    }

    async function loadDatabaseInfo() {
      const info =
        document.getElementById("databaseInfo");

      info.textContent =
        "Loading IMS and GOV data...";

      try {
        validateApiUrl();

        const response =
          await jsonpRequest({
            action: "info"
          });

        if (!response.success) {
          throw new Error(
            response.message ||
            "Unable to load data."
          );
        }

        info.textContent =
          "Loaded: " +
          response.total +
          " items | IMS: " +
          response.ims +
          " | GOV: " +
          response.gov +
          " | Dictionary: " +
          response.dictionaryEntries;

      } catch (error) {
        info.textContent =
          "Data load error: " +
          error.message;
      }
    }

    async function runSearch() {
      const input =
        document
          .getElementById("searchInput")
          .value
          .trim();

      const button =
        document.getElementById(
          "searchButton"
        );

      if (!input) {
        setMessage(
          "Please type or speak a search."
        );
        return;
      }

      setMessage("");

      button.disabled = true;
      button.innerHTML =
        '<span class="loader"></span>Searching...';

      document
        .getElementById("results")
        .innerHTML = "";

      try {
        validateApiUrl();

        const response =
          await jsonpRequest({
            action: "search",
            q: input
          });

        if (!response.success) {
          throw new Error(
            response.message ||
            "Search failed."
          );
        }

        renderSearchResults(
          response.results || []
        );

      } catch (error) {
        setMessage(
          "Search error: " +
          error.message
        );

      } finally {
        button.disabled = false;
        button.textContent =
          "Search Books";
      }
    }

    function renderSearchResults(
      queryResults
    ) {
      const resultsBox =
        document.getElementById(
          "results"
        );

      let html = "";

      queryResults.forEach(
        function(queryResult) {
          const matches =
            queryResult.matches || [];

          const encodedQuery =
            encodeJsValue(
              queryResult.query
            );

          html +=
            '<div class="query-heading">' +
              'Search: "' +
              escapeHtml(queryResult.query) +
              '" — ' +
              matches.length +
              " relevant result(s)" +
            "</div>";

          html +=
            '<div class="feedback-question">' +

              '<div class="feedback-question-title">' +
                "Kya aapko sahi search result mila?" +
              "</div>" +

              '<div class="feedback-answer-buttons">' +

                '<button class="feedback-yes" ' +
                  'onclick="handleRelevantYes(' +
                    "'" +
                    encodedQuery +
                    "'" +
                  ')">' +
                  "Yes, result sahi hai" +
                "</button>" +

                '<button class="feedback-no" ' +
                  'onclick="openFeedbackModal(' +
                    "'" +
                    encodedQuery +
                    "'" +
                  ')">' +
                  "No, mujhe doosri book chahiye" +
                "</button>" +

              "</div>" +

              '<div class="feedback-note">' +
                "Yes select karne ke baad neeche correct book par green button dabao." +
              "</div>" +

            "</div>";

          if (!matches.length) {
            html +=
              '<div class="card no-match">' +
                '<div class="book-name">' +
                  "No relevant match found" +
                "</div>" +
                '<div class="detail">' +
                  "No button click karke expected book name ya SKU batao." +
                "</div>" +
              "</div>";

            return;
          }

          matches.forEach(function(book) {
            html +=
              '<div class="card">' +

                '<div class="sku">' +
                  escapeHtml(book.sku) +
                "</div>" +

                '<div class="book-name">' +
                  escapeHtml(book.name) +
                "</div>" +

                '<div class="detail">' +
                  "Category: " +
                  escapeHtml(book.category) +
                "</div>" +

                '<div class="detail">' +
                  "Closing Stock: " +
                  '<span class="stock">' +
                    escapeHtml(
                      book.closingStock
                    ) +
                  "</span>" +
                "</div>" +

                '<div class="meta">' +
                  "Source: " +
                  escapeHtml(book.source) +
                  " | Match: " +
                  escapeHtml(book.score) +
                  "%" +
                "</div>" +

                '<button class="correct" ' +
                  'onclick="markCorrectBook(' +
                    "'" +
                    encodedQuery +
                    "'," +
                    "'" +
                    encodeJsValue(
                      book.sku
                    ) +
                    "'" +
                  ')">' +
                  "✓ This is the correct book" +
                "</button>" +

              "</div>";
          });
        }
      );

      resultsBox.innerHTML = html;
    }

    function handleRelevantYes(
      encodedSearch
    ) {
      const searchText =
        decodeURIComponent(
          encodedSearch
        );

      setMessage(
        'Search "' +
        searchText +
        '" ke liye neeche correct book ka green button select karo.',
        true
      );

      window.scrollBy({
        top: 220,
        behavior: "smooth"
      });
    }

    async function markCorrectBook(
      encodedSearch,
      encodedSku
    ) {
      const searchText =
        decodeURIComponent(
          encodedSearch
        );

      const sku =
        decodeURIComponent(
          encodedSku
        );

      try {
        setMessage(
          "Saving correct-book feedback...",
          true
        );

        const response =
          await jsonpRequest({
            action: "feedback",
            feedbackType: "correct",
            searchText: searchText,
            selectedSku: sku
          });

        if (!response.success) {
          throw new Error(
            response.message ||
            "Feedback save failed."
          );
        }

        setMessage(
          "Correct book feedback successfully saved.",
          true
        );

      } catch (error) {
        setMessage(
          "Feedback error: " +
          error.message
        );
      }
    }

    function openFeedbackModal(
      encodedSearch
    ) {
      activeFeedbackSearch =
        decodeURIComponent(
          encodedSearch
        );

      document
        .getElementById(
          "feedbackSearchLabel"
        )
        .textContent =
          'Search: "' +
          activeFeedbackSearch +
          '"';

      document
        .getElementById(
          "expectedBook"
        )
        .value = "";

      document
        .getElementById(
          "expectedSku"
        )
        .value = "";

      document
        .getElementById(
          "feedbackNote"
        )
        .value = "";

      document
        .getElementById(
          "feedbackModal"
        )
        .classList
        .add("show");

      setTimeout(function() {
        document
          .getElementById(
            "expectedBook"
          )
          .focus();
      }, 100);
    }

    function closeFeedbackModal() {
      document
        .getElementById(
          "feedbackModal"
        )
        .classList
        .remove("show");

      activeFeedbackSearch = "";
    }

    async function submitWrongFeedback() {
      const expectedBook =
        document
          .getElementById(
            "expectedBook"
          )
          .value
          .trim();

      const expectedSku =
        document
          .getElementById(
            "expectedSku"
          )
          .value
          .trim();

      const note =
        document
          .getElementById(
            "feedbackNote"
          )
          .value
          .trim();

      const button =
        document.getElementById(
          "submitFeedbackButton"
        );

      if (!activeFeedbackSearch) {
        return;
      }

      if (
        !expectedBook &&
        !expectedSku
      ) {
        alert(
          "Expected book name ya SKU enter karo."
        );
        return;
      }

      button.disabled = true;
      button.textContent =
        "Saving...";

      try {
        const response =
          await jsonpRequest({
            action: "feedback",
            feedbackType: "wrong",
            searchText:
              activeFeedbackSearch,
            expectedBook:
              expectedBook,
            expectedSku:
              expectedSku,
            note: note
          });

        if (!response.success) {
          throw new Error(
            response.message ||
            "Feedback save failed."
          );
        }

        closeFeedbackModal();

        setMessage(
          "Feedback saved. Dictionary me pending training suggestion add ho gayi hai.",
          true
        );

      } catch (error) {
        alert(
          "Feedback error: " +
          error.message
        );

      } finally {
        button.disabled = false;
        button.textContent =
          "Submit Feedback";
      }
    }

    function setupVoiceRecognition() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        return false;
      }

      recognition =
        new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 3;

      recognition.onstart = function() {
        voiceRunning = true;

        document
          .getElementById(
            "voiceButton"
          )
          .disabled = true;

        document
          .getElementById(
            "stopVoiceButton"
          )
          .disabled = false;

        setMessage(
          "Listening...",
          true
        );
      };

      recognition.onresult = function(
        event
      ) {
        let transcript = "";

        for (
          let index =
            event.resultIndex;
          index <
            event.results.length;
          index++
        ) {
          transcript +=
            event.results[index][0]
              .transcript + " ";
        }

        document
          .getElementById(
            "searchInput"
          )
          .value =
            transcript.trim();
      };

      recognition.onerror = function(
        event
      ) {
        setMessage(
          "Voice error: " +
          event.error
        );
      };

      recognition.onend = function() {
        voiceRunning = false;

        document
          .getElementById(
            "voiceButton"
          )
          .disabled = false;

        document
          .getElementById(
            "stopVoiceButton"
          )
          .disabled = true;

        const text =
          document
            .getElementById(
              "searchInput"
            )
            .value
            .trim();

        if (text) {
          runSearch();
        }
      };

      return true;
    }

    function startVoiceSearch() {
      if (!recognition) {
        const supported =
          setupVoiceRecognition();

        if (!supported) {
          setMessage(
            "Voice recognition is not supported in this browser."
          );
          return;
        }
      }

      if (voiceRunning) {
        return;
      }

      document
        .getElementById(
          "searchInput"
        )
        .value = "";

      try {
        recognition.start();
      } catch (error) {
        setMessage(
          "Voice Search dobara click karne se pehle ek second wait karo."
        );
      }
    }

    function stopVoiceSearch() {
      if (
        recognition &&
        voiceRunning
      ) {
        recognition.stop();
      }
    }

    function clearSearch() {
      if (
        recognition &&
        voiceRunning
      ) {
        recognition.stop();
      }

      document
        .getElementById(
          "searchInput"
        )
        .value = "";

      document
        .getElementById(
          "results"
        )
        .innerHTML = "";

      setMessage("");
    }

    loadDatabaseInfo();
  </script>
</body>
</html>
